name: Tests
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  test:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install disposable database test runtime
        run: npm install --prefix .local/sql-check --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
      - run: npm run typecheck
      - name: Run the test suites
        shell: bash
        run: |
          mkdir -p .local
          npm test 2>&1 | tee .local/npm-test.log
      - name: Assert that node:test skipped nothing
        shell: bash
        run: |
          log=.local/npm-test.log
          # node --test prints a TAP summary when stdout is not a TTY; accept the spec reporter's too.
          summary="$(grep -E '^(#|ℹ) (tests|suites|pass|fail|cancelled|skipped|todo) [0-9]+$' "$log" || true)"
          if [ -z "$summary" ]; then
            echo "::error::node:test summary not found in $log; the skipped count cannot be verified"
            exit 1
          fi
          printf '%s\n' "$summary"
          { echo '### node:test'; echo '```'; printf '%s\n' "$summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          skipped="$(printf '%s\n' "$summary" | awk '$2 == "skipped" { print $3 }')"
          if [ "${skipped:-unknown}" != "0" ]; then
            echo "::error::node:test skipped ${skipped:-an unknown number of} test(s); the SQL suites need the disposable PGlite runtime in .local/sql-check"
            grep -n '# SKIP' "$log" || true
            exit 1
          fi
      - run: npm run score -- --week 6
