name: Tests
on:
  push:
    branches: [main]
  pull_request:
  # Nightly: every hosted migration's rollback too (tests/rollback.test.mjs, GTL_ROLLBACK_ALL).
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:
# A newer commit replaces an older run on the same ref, on main too (Sean, October 29, 2026): releases ship the newest
# green main SHA (docs/SHARED_DEPLOYMENT.md "Release train"), so an older main run would only hold runners. The event is in
# the group so a push never cancels the nightly scheduled run, nor the other way round.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  windows-portability:
    name: Windows portability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify Git synchronization, private recovery and UI paths on Windows
        run: node --test tests/git-sync.test.mjs tests/local-recovery.test.mjs tests/sportsbook-sources-ui.test.mjs
  # npm test in three parallel shards (node --test and vitest --shard); "Typecheck and test" below is the one check that
  # branch protection and the release gate (scripts/release-preflight.mjs REQUIRED_CI) require, so the shard names can change.
  test-shard:
    name: Test shard (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
      - name: Check the diff for whitespace errors and conflict markers
        if: matrix.shard == 1
        shell: bash
        env:
          # The PR's base tip, or the previous main tip for a push; HEAD is the PR merge commit or the pushed tip.
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "::notice::No base commit for this ${{ github.event_name }} event; skipping git diff --check"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BASE_SHA"; then
            echo "::warning::Base commit $BASE_SHA is not reachable (force push?); skipping git diff --check"
            exit 0
          fi
          git diff --check "$BASE_SHA" HEAD || { echo "::error::git diff --check found trailing whitespace, blank lines at EOF or conflict markers (listed above)"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install disposable database test runtime
        run: npm install --prefix .local/sql-check --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
      - run: npm run typecheck
        if: matrix.shard == 1
      - name: Run the test suites
        shell: bash
        env:
          GTL_ROLLBACK_ALL: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '1' || '' }}
          TEST_SHARD: ${{ matrix.shard }}/3
        run: |
          mkdir -p .local
          npm run test:shard 2>&1 | tee .local/npm-test.log
      - name: Assert that node:test skipped nothing
        shell: bash
        run: |
          log=.local/npm-test.log
          # node --test prints a TAP summary when stdout is not a TTY; accept the spec reporter's too.
          summary="$(grep -E '^(#|ℹ) (tests|suites|pass|fail|cancelled|skipped|todo) [0-9]+$' "$log" || true)"
          if [ -z "$summary" ]; then
            echo "::error::node:test summary not found in $log; the skipped count cannot be verified"
            exit 1
          fi
          printf '%s\n' "$summary"
          { echo '### node:test'; echo '```'; printf '%s\n' "$summary"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          skipped="$(printf '%s\n' "$summary" | awk '$2 == "skipped" { print $3 }')"
          if [ "${skipped:-unknown}" != "0" ]; then
            echo "::error::node:test skipped ${skipped:-an unknown number of} test(s); the SQL suites need the disposable PGlite runtime in .local/sql-check"
            grep -n '# SKIP' "$log" || true
            exit 1
          fi
      - run: npm run score -- --week 6
        if: matrix.shard == 1
  test:
    name: Typecheck and test
    needs: test-shard
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every test shard passed
        run: test "${{ needs.test-shard.result }}" = success
