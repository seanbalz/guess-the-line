name: Read-only code and security audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'dashboard/**'
      - 'cloud/**'
      - 'package*.json'
      - '.github/workflows/security-audit.yml'
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Semgrep static analysis (report only)
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep scan --config p/owasp-top-ten --config p/security-audit --metrics=off --json --output semgrep-report.json .
      - name: Upload Semgrep findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trivy filesystem and dependency scan (report only)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: json
          output: trivy-report.json
          exit-code: '0'
      - name: Upload Trivy findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn
