name: Read-only code and security audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
  pull_request:
    paths:
      - 'src/**'
      - 'server/**'
      - 'dashboard/**'
      - 'cloud/**'
      - 'package*.json'
      - '.github/workflows/security-audit.yml'
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Semgrep static analysis
        run: |
          python -m pip install --disable-pip-version-check semgrep
          semgrep scan --config p/owasp-top-ten --config p/security-audit --error --metrics=off .
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Trivy filesystem and dependency scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          exit-code: '1'
