name: Read-only code and security audit
on:
  workflow_dispatch:
  schedule:
    - cron: '17 10 * * 1'
  pull_request:
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check security evidence reporting
        run: python -m unittest discover -s tests -p test_security_audit.py
      - name: Semgrep static analysis (report only)
        env:
          GTL_AUDIT_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SEMGREP_ENABLE_VERSION_CHECK: '0'
        run: |
          python -m pip install --disable-pip-version-check semgrep==1.185.0
          python scripts/security_audit.py
      - name: Upload Semgrep findings and coverage evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semgrep-report
          path: .local/security-audit/
          include-hidden-files: true
          if-no-files-found: error
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Trivy filesystem and dependency scan (report only)
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          cache-dir: .cache/trivy
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          format: json
          output: trivy-report.json
          exit-code: '0'
      - name: Record the Trivy engine and database versions
        if: always()
        run: trivy --cache-dir .cache/trivy --version | tee trivy-version.txt
      - name: Upload Trivy findings
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: trivy-report
          path: |
            trivy-report.json
            trivy-version.txt
          if-no-files-found: warn
