name: Brand QA
on:
  push:
    branches: [main]
  pull_request:
# Every main commit gets its own run: releases need green push CI on the exact SHA, and a shared main group
# queued commits behind each other and cancelled the ones still waiting. PR runs still replace older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  brand-qa:
    name: Brand QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-brand-docs.py
