name: Brand QA
on:
  push:
    branches: [main]
  pull_request:
# A newer commit replaces an older run on the same ref, on main too (Sean, October 29, 2026): releases ship the newest
# green main SHA (docs/SHARED_DEPLOYMENT.md "Release train"), so an older main run would only hold runners. The event is in
# the group so a push never cancels the nightly scheduled run, nor the other way round.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  brand-qa:
    name: Brand QA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-brand-docs.py
