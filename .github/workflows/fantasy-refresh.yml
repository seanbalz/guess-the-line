name: Fantasy refresh
# D-57: builds the Fantasy snapshot and last week's review from nflverse and publishes them as release assets of this
# repository (data only). Daily at 11:00 UTC (4:00 AM PT; 3:00 AM PT in standard time), after nflverse's overnight
# updates; manual runs stay available and default to a dry run.
on:
  schedule:
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and validate without uploading
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: fantasy-refresh
  cancel-in-progress: false
jobs:
  refresh:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build
        run: node scripts/fantasy-refresh.mjs --out .local/fantasy-release
      - name: Publish
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == false) }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/fantasy-publish.mjs --dir .local/fantasy-release
