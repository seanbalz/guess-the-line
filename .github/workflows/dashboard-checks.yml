name: Dashboard checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install disposable database test runtime
        run: npm install --prefix .local/sql-check --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
      - run: npm test
      - run: npm run build
      - name: Install Chromium for Playwright
        uses: ./.github/actions/playwright-chromium
      - run: npm run test:browser
      - name: Cloud browser suite (the persona specs run in the personas job)
        run: npx playwright test --config playwright.cloud.config.js tests/cloud-browser/*.spec.js
      - name: Build and inspect the authenticated frontend
        env:
          VITE_SUPABASE_URL: https://gtl-frontend-check.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_frontend_test_only
        run: |
          npm run build:cloud
          node scripts/check-cloud-boundary.mjs --bundle-only
          node scripts/release-manifest.mjs
      - name: Check preserved snapshots and model integrity
        run: |
          python3 scripts/snapshots.py check
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s model -v
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-browser-evidence
          path: |
            test-results/
            .local/cloud-browser-results/
          include-hidden-files: true
          retention-days: 7
  personas:
    name: Persona suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install disposable database test runtime
        run: npm install --prefix .local/sql-check --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
      - name: Install Chromium for Playwright
        uses: ./.github/actions/playwright-chromium
      - name: Persona static checks (contrast, tap targets, reduced motion)
        run: node scripts/persona-static-checks.mjs
      - name: Persona browser suite
        run: npx playwright test --config playwright.cloud.config.js tests/cloud-browser/personas
      - name: Save persona evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persona-evidence
          path: |
            .local/personas/
            .local/previews/personas/
            .local/cloud-browser-results/
          include-hidden-files: true
          retention-days: 7
