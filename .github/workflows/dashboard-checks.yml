name: Dashboard checks
on:
  push:
    branches: [main]
  pull_request:
# Every main commit gets its own run: releases need green push CI on the exact SHA, and a shared main group
# queued commits behind each other and cancelled the ones still waiting. PR runs still replace older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
permissions:
  contents: read
jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install disposable database test runtime
        run: npm install --prefix .local/sql-check --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
      # npm test runs in the Tests workflow (Typecheck and test, which also asserts that nothing was skipped).
      - run: npm run build
      - name: Install Chromium for Playwright
        uses: ./.github/actions/playwright-chromium
      - run: npm run test:browser
      - name: Lazy-loading performance suite
        run: npm run test:performance
      - name: Accessibility suite (axe on the critical paths)
        run: npm run test:accessibility
      - name: Build and inspect the authenticated frontend
        env:
          VITE_SUPABASE_URL: https://gtl-frontend-check.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_frontend_test_only
        run: |
          npm run build:cloud
          node scripts/check-cloud-boundary.mjs --bundle-only
          node scripts/release-manifest.mjs
      - name: Restore the pinned public model data
        id: model-data
        uses: actions/cache@v6
        with:
          path: .local/model-data
          key: model-data-${{ hashFiles('model/sources.json') }}
      - name: Fetch the pinned public model data (cache miss)
        if: steps.model-data.outputs.cache-hit != 'true'
        run: python3 model/pipeline.py fetch
      - name: Check preserved snapshots and model integrity
        shell: bash
        run: |
          python3 scripts/snapshots.py check
          python3 -m unittest discover -s tests -v
          python3 -m unittest discover -s model -v 2>&1 | tee .local/model-tests.log
          { echo '### model/test_pipeline.py'; grep -E '^(Ran [0-9]+ tests?|OK|FAILED)' .local/model-tests.log | sed 's/^/- /'; } >> "$GITHUB_STEP_SUMMARY"
          if grep -qE '^(OK|FAILED) \(.*skipped=' .local/model-tests.log; then
            echo "::error::model tests were skipped: .local/model-data/fivethirtyeight-nfl-games.csv is missing, so the pinned research run was not verified"
            grep -n 'skipped' .local/model-tests.log || true
            exit 1
          fi
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-browser-evidence
          path: |
            test-results/
            .local/performance-browser-results/
            .local/accessibility-browser-results/
          include-hidden-files: true
          retention-days: 7
  cloud-browser:
    # The cloud browser suite, split by file across four runners (the persona specs run in the personas job).
    name: Cloud browser suite (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install disposable database test runtime
        run: npm install --prefix .local/sql-check --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
      - name: Install Chromium for Playwright
        uses: ./.github/actions/playwright-chromium
      - name: Cloud browser suite, shard ${{ matrix.shard }} of 4
        run: npx playwright test --config playwright.cloud.config.js --shard=${{ matrix.shard }}/4 tests/cloud-browser/*.spec.js
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cloud-browser-evidence-${{ matrix.shard }}
          path: |
            test-results/
            .local/cloud-browser-results/
          include-hidden-files: true
          retention-days: 7
  personas:
    name: Persona suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install disposable database test runtime
        run: npm install --prefix .local/sql-check --no-audit --no-fund --save-exact @electric-sql/pglite@0.5.8
      - name: Install Chromium for Playwright
        uses: ./.github/actions/playwright-chromium
      - name: Persona static checks (contrast, tap targets, reduced motion)
        run: node scripts/persona-static-checks.mjs
      - name: Persona browser suite
        run: npx playwright test --config playwright.cloud.config.js tests/cloud-browser/personas
      - name: Save persona evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: persona-evidence
          path: |
            .local/personas/
            .local/previews/personas/
            .local/cloud-browser-results/
          include-hidden-files: true
          retention-days: 7
