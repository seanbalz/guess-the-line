name: Ops alerts
# Item 22: a failed Fantasy or Research data refresh on main opens one GitHub issue assigned to the repository owner
# (GitHub notifies the phone app and email); later failures update that issue without a new notification, and the next
# run that publishes comments and closes it. workflow_run starts as soon as the watched run completes, so alerts do not
# wait for GitHub's late scheduled starts. A manual run replays one past run by id. The issue holds only the workflow
# name, run link, event, failed step and times, never log text: this repository is public.
on:
  workflow_run:
    workflows: [Fantasy refresh, Research data refresh]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Workflow run id to alert on
        required: true
        type: string
permissions:
  actions: read
  contents: read
  issues: write
concurrency:
  group: ops-alerts
  cancel-in-progress: false
jobs:
  alert:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Open, update or close the alert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: node scripts/ops-alert.mjs
