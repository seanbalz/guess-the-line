name: Ops alerts
# Item 22: a failed Fantasy or Research data refresh on main opens one GitHub issue assigned to the repository owner
# (GitHub notifies the phone app and email); later failures update that issue without a new notification, and the next
# run that publishes comments and closes it. workflow_run starts as soon as the watched run completes, so alerts do not
# wait for GitHub's late scheduled starts. The issue holds only the workflow name, run link, event, failed step and
# times, never log text: this repository is public. There is no manual trigger: on November 3 a manual replay ran
# beside a real run's alert in another group and both closed the same issue. To check a past run without writing:
# RUN_ID=<id> GH_TOKEN=$(gh auth token) node scripts/ops-alert.mjs --dry-run
on:
  workflow_run:
    workflows: [Fantasy refresh, Research data refresh]
    types: [completed]
permissions:
  actions: read
  contents: read
  issues: write
# One group per watched workflow: its runs are handled in order, so one incident opens one issue and closes once. GitHub
# keeps only the newest pending run of a group, so a shared group could drop the other workflow's alert.
concurrency:
  group: ops-alerts-${{ github.event.workflow_run.path }}
  cancel-in-progress: false
jobs:
  alert:
    if: github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Open, update or close the alert
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: node scripts/ops-alert.mjs
