<!doctype html>
<html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guess The Line — Gap period fixes</title>
<link rel="stylesheet" href="../../web/src/next/styles/tokens.css"><link rel="stylesheet" href="../../web/src/next/styles/base.css">
<style>
body{margin:0}.review{padding:var(--gx-space-8);max-width:1320px;margin:auto}.review header{display:flex;justify-content:space-between;gap:var(--gx-space-6);align-items:end;margin-bottom:var(--gx-space-6)}h1{font-size:32px;line-height:1.2;margin:var(--gx-space-2) 0}p{color:var(--gx-text-2);margin:var(--gx-space-2) 0}.eyebrow{font-size:13px;color:var(--gx-accent-ink)}.controls{display:flex;gap:var(--gx-space-3)}label{display:grid;gap:var(--gx-space-2);font-size:13px;color:var(--gx-text-2)}select{min-height:44px;background:var(--gx-card-face);color:var(--gx-text-1);font:inherit;font-size:16px;padding:var(--gx-space-2);border:1px solid var(--gx-border);border-radius:var(--gx-radius-sm)}.screens{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--gx-space-5)}figure{margin:0;min-width:0}h2{font-size:18px;margin:0 0 var(--gx-space-2);font-weight:600}figcaption p{font-size:14px;line-height:20px;min-height:40px}img{display:block;width:100%;height:auto;border:1px solid var(--gx-border);border-radius:var(--gx-radius-md);box-shadow:var(--gx-glass-shadow)}footer{font-size:13px;color:var(--gx-text-3);margin-top:var(--gx-space-6)}@media(max-width:800px){.review{padding:var(--gx-space-4)}.review header{display:block}.controls{margin-top:var(--gx-space-4)}.screens{grid-template-columns:1fr;max-width:390px;margin:auto}}
</style></head>
<body class="gx"><main class="review"><header><div><div class="eyebrow">GUESS THE LINE · NOVEMBER 9, 2026</div><h1>Gap period fixes</h1><p>Working UI previews. Synthetic sample results.</p></div><div class="controls"><label>Theme<select id="theme"><option value="dark">Dark</option><option value="light">Light</option></select></label><label>Version<select id="stage"><option value="after">After fixes</option><option value="before">Before fixes</option></select></label></div></header>
<div class="screens">
<figure><figcaption><h2>Keep the selected period</h2><p id="period-note">All time stays selected after changing recommendation week and refreshing.</p></figcaption><img id="period-image" src="after-dark-period.png" width="390" height="1000" alt="All time record with fourteen synthetic graded gaps"></figure>
<figure><figcaption><h2>Keep the applied range</h2><p id="custom-note">Custom range retains its From and To weeks after refreshing.</p></figcaption><img id="custom-image" src="after-dark-custom.png" width="390" height="1000" alt="Custom range controls after refresh"></figure>
<figure><figcaption><h2>Show every expanded row</h2><p id="expanded-note">The expanded list grows from seven to all fourteen gaps across both weeks.</p></figcaption><img id="expanded-image" src="after-dark-expanded.png" width="390" height="1000" alt="Expanded record ends at gap fourteen with Show first 6 available"></figure>
</div><footer>390px browser captures · Existing approved Prism design · Local fixes, not deployed · Figures are fixtures, not account statistics.</footer></main>
<script>
const theme=document.querySelector('#theme'),stage=document.querySelector('#stage');
function update(){document.documentElement.dataset.theme=theme.value;for(const name of ['period','custom','expanded'])document.querySelector(`#${name}-image`).src=`${stage.value}-${theme.value}-${name}.png`;const before=stage.value==='before';document.querySelector('#period-note').textContent=before?'The selection resets to Week, showing seven gaps instead of the full period.':'All time stays selected after changing recommendation week and refreshing.';document.querySelector('#custom-note').textContent=before?'The applied custom range is lost and the control returns to Week.':'Custom range retains its From and To weeks after refreshing.';document.querySelector('#expanded-note').textContent=before?'Only seven of fourteen rows appear; the button still says Show first 6.':'The expanded list grows from seven to all fourteen gaps across both weeks.';document.querySelector('#period-image').alt=before?'Record period incorrectly reset to Week':'All time record with fourteen synthetic graded gaps';document.querySelector('#expanded-image').alt=before?'Expanded record incorrectly ends at gap seven':'Expanded record ends at gap fourteen with Show first 6 available';}
theme.addEventListener('change',update);stage.addEventListener('change',update);
</script></body></html>
